# موقتی: می‌سنجد endpoint عمومی syndication توییتر از روی runner های GitHub
# چطور رفتار می‌کند. از روی IP خانگی بعد از چند درخواست 429 می‌دهد؛ سؤال این
# است که با IP تازه‌ی هر اجرا چند اکانت را می‌شود گرفت و توییت‌ها چقدر تازه‌اند.
name: probe-twitter

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: probe syndication
        run: |
          python - <<'PY'
          import httpx, json, re, time
          from datetime import datetime, timezone

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 (KHTML, like Gecko) "
                              "Chrome/128.0.0.0 Safari/537.36"}
          URL = "https://syndication.twitter.com/srv/timeline-profile/screen-name/{}"
          ACCOUNTS = ["TheHackersNews", "BleepinComputer", "OpenAI", "GoogleAI",
                      "verge", "arstechnica", "simonw", "karpathy",
                      "TechCrunch", "Wired", "sama", "ylecun"]

          now = datetime.now(timezone.utc)
          ok = fail = 0
          with httpx.Client(timeout=25, follow_redirects=True, headers=UA) as c:
              for i, sn in enumerate(ACCOUNTS, 1):
                  r = c.get(URL.format(sn))
                  if r.status_code != 200:
                      print(f"{i:2}. {sn:18} {r.status_code}")
                      fail += 1
                      time.sleep(3)
                      continue
                  m = re.search(r'__NEXT_DATA__" type="application/json">(.*?)</script>',
                                r.text, re.S)
                  if not m:
                      print(f"{i:2}. {sn:18} 200 but no data")
                      fail += 1
                      continue
                  entries = (json.loads(m.group(1)).get("props", {})
                             .get("pageProps", {}).get("timeline", {})
                             .get("entries", []))
                  rows = []
                  for e in entries:
                      t = (e.get("content") or {}).get("tweet") or {}
                      if not t.get("created_at"):
                          continue
                      age = (now - datetime.strptime(
                          t["created_at"], "%a %b %d %H:%M:%S %z %Y")).total_seconds() / 3600
                      rows.append((age, t.get("favorite_count"), t.get("retweet_count")))
                  rows.sort()
                  ok += 1
                  if rows:
                      print(f"{i:2}. {sn:18} 200  n={len(rows):2} "
                            f"newest={rows[0][0]:6.1f}h fav={rows[0][1]} rt={rows[0][2]}")
                  else:
                      print(f"{i:2}. {sn:18} 200  empty")
                  time.sleep(3)
          print(f"\nموفق {ok} / ناموفق {fail}")
          PY
