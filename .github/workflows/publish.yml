name: publish

on:
  schedule:
    # ساعتی، یک پست در هر اجرا: سقف ۲۴ در روز و در عمل ۱۸ تا ۲۲.
    # عرضه‌ی منابع حدود ۴۶ آیتم در روز است، پس همین cron تعیین‌کننده‌ی تعداد
    # پست‌هاست نه کمبود محتوا.
    - cron: "0 * * * *"
  workflow_dispatch:

# برای commit کردن state.json لازم است.
permissions:
  contents: write

# اجراهای همزمان روی یک state.json به هم می‌ریزند.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.main

      - name: commit state
        run: |
          if [[ -z "$(git status --porcelain state.json)" ]]; then
            echo "state تغییر نکرد"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # هر push کد از بیرون این اجرا را عقب می‌اندازد. rebase کن و دوباره
          # تلاش کن، وگرنه هر بار که repo تغییر کند یک اجرا از دست می‌رود.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push شکست خورد (تلاش $attempt)"
            sleep 5
          done
          exit 1
