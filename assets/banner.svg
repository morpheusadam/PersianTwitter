<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="PersianTwitter — tech news ranked by corroboration, summarized into Persian">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="45%" stop-color="#15213a"/>
      <stop offset="100%" stop-color="#1b1533"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#sky)"/>
  <circle cx="215" cy="120" r="230" fill="url(#glowA)"/>
  <circle cx="1010" cy="235" r="250" fill="url(#glowB)"/>

  <!-- scattered sources converging into one story -->
  <g stroke="#64748b" stroke-opacity="0.55" stroke-width="1.6" fill="none">
    <path d="M120 96 C 250 96, 300 150, 420 160"/>
    <path d="M120 140 C 250 140, 300 156, 420 160"/>
    <path d="M120 184 C 250 184, 300 168, 420 160"/>
    <path d="M120 228 C 250 228, 300 176, 420 160"/>
  </g>
  <g fill="#94a3b8">
    <circle cx="112" cy="96" r="7"/>
    <circle cx="112" cy="140" r="7"/>
    <circle cx="112" cy="184" r="7"/>
    <circle cx="112" cy="228" r="7"/>
  </g>
  <circle cx="428" cy="160" r="15" fill="url(#accent)"/>
  <circle cx="428" cy="160" r="26" fill="none" stroke="url(#accent)" stroke-opacity="0.5" stroke-width="1.6"/>

  <text x="500" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#f8fafc">PersianTwitter</text>
  <text x="502" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#cbd5e1">Tech news ranked by how many outlets carry it,</text>
  <text x="502" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#cbd5e1">summarized into Persian, posted to Telegram.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#93c5fd">
    <rect x="502" y="240" width="118" height="30" rx="15" fill="#38bdf8" fill-opacity="0.13" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="561" y="260" text-anchor="middle">54 sources</text>
    <rect x="632" y="240" width="128" height="30" rx="15" fill="#818cf8" fill-opacity="0.13" stroke="#818cf8" stroke-opacity="0.35"/>
    <text x="696" y="260" text-anchor="middle">no server</text>
    <rect x="772" y="240" width="104" height="30" rx="15" fill="#f472b6" fill-opacity="0.13" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="824" y="260" text-anchor="middle">$0/month</text>
  </g>
</svg>
