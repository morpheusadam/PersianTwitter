# منابع و تنظیمات کانال.
#
# چهار نوع منبع:
#   bluesky    — اکانت در Bluesky. عدد like/repost/reply می‌دهد، پس امتیاز ویروسی می‌گیرد.
#   hackernews — داستان‌های تازه‌ی HN بالای min_points. عدد points/comments دارد.
#   lobsters   — صفحه‌ی hottest لابسترز. سیگنالش برای امنیت و سیستم تمیز است.
#   rss        — هر فید RSS. عدد تعاملی ندارد، پس با authority و تازگی رتبه می‌گیرد.
#
# authority بین ۰ و ۱ — فقط برای منابع rss. یعنی «وقتی هیچ سیگنال تعاملی نداریم،
# چقدر به این منبع اعتماد کنیم». عدد بالاتر یعنی شانس بیشتر برای انتخاب شدن.

settings:
  # یک پست در هر اجرا، و cron ساعتی (به publish.yml نگاه کنید).
  #
  # عمداً ۱ است تا کانال رگباری نشود. با ۳ پست در هر اجرا، سه پست ظرف ۱۲ ثانیه
  # پشت هم می‌آمدند و بعد نیم‌ساعت سکوت. حالا فاصله‌ها یکنواخت است.
  #
  # ۲۴ اجرا در روز × ۱ پست = سقف ۲۴، و در عمل حدود ۱۸ تا ۲۲ چون همه‌ی اجراها
  # چیز تازه‌ای پیدا نمی‌کنند. عرضه‌ی واقعی اندازه‌گیری شد: حدود ۴۶ آیتم در روز
  # قبل از فیلتر موضوعی، پس عرضه محدودکننده نیست و cron تعیین‌کننده است.
  max_posts_per_run: 1

  # اگر ترجمه‌ی بهترین آیتم شکست بخورد، این تعداد گزینه‌ی بعدی امتحان می‌شود.
  # بدون این، یک آیتم مشکل‌دار کل اجرا را بی‌نتیجه می‌کرد.
  spare_candidates: 3

  # نسبت بین دو استخر: نصف پست‌ها اجتماعی (توییت‌ها)، نصف خبری.
  # چون هر اجرا فقط یک پست دارد، این نسبت داخل یک اجرا اعمال نمی‌شود بلکه در
  # طول زمان نگه داشته می‌شود؛ شمارشش در state.json است.
  viral_share: 0.5

  # سقف سن برای منابع دارای عدد تعامل. اینجا تازگی حیاتی است چون کل ایده‌ی
  # امتیاز ویروسی سرعت رشد در ساعات اول است.
  max_age_hours: 12

  # سقف سن برای فیدهای خبری. اندازه‌گیری شد: با ۴۸ ساعت فقط ۶ آیتم در روز
  # عبور می‌کنند و استخر خبری خشک می‌شود، چون فیدهایی مثل Krebs و OpenAI و
  # MIT دو تا سه روز فاصله بین انتشارها دارند. با ۷۲ ساعت می‌شود ۱۶ در روز.
  # تابع زوال زمانی خودش قدیمی‌ترها را ته صف می‌گذارد.
  editorial_max_age_hours: 72

  # فاصله بین ارسال دو پست، برای نخوردن به rate limit تلگرام.
  seconds_between_posts: 4

  # متن کوتاه‌تر از این در فیدهای خبری احتمالاً ریپلای یا تیتر خالی است.
  min_text_length: 80
  # منابع دارای عدد تعامل عنوان کوتاه دارند ولی خودِ عدد کیفیت را ثابت می‌کند.
  min_ranked_text_length: 30

  # اگر آیتم از فید عکس نداشت: صفحه‌ی مقاله را باز کن و og:image یا یکی از
  # تصاویر داخل متن را بردار؛ اگر مقاله هیچ عکسی نداشت سراغ تصویر شاخص خودِ
  # وب‌سایت برو؛ و اگر آن هم نبود assets/fallback.jpg آپلود می‌شود.
  scrape_images: true

  # مدل‌های Gemini، به ترتیب اولویت.
  #
  # سهمیه‌ی free tier «به ازای هر مدل در روز» است و برای هر کدام فقط ۲۰ درخواست.
  # quotaId اش این را صریح می‌گوید: GenerateRequestsPerDayPerProjectPerModel.
  # پس با یک مدل روزی ۲۰ پست سقف ماست. با چرخیدن بین چند مدل، بودجه چند برابر
  # می‌شود بدون یک ریال هزینه. وقتی یکی 429 داد، بعدی امتحان می‌شود.
  #
  # gemma جواب می‌دهد ولی دستور را نادیده می‌گیرد و متن meta می‌نویسد، پس نیست.
  gemini_models:
    - gemini-3.1-flash-lite
    - gemini-3.5-flash-lite
    - gemini-3-flash-preview
    - gemini-2.5-flash

sources:
  # ─────────────────────────────────────────────── سیگنال ویروسی (عدد تعامل دارند)

  - type: hackernews
    label: Hacker News
    min_points: 50

  - type: lobsters
    label: Lobsters
    # لابسترز جامعه‌ی کوچکی است و امتیازهایش یک رقمی؛ بدون این کف، یک پست
    # ۳ امتیازی از یک بحث ۲۰۰ امتیازی HN جلو می‌زند.
    min_engagement: 25

  # اکانت‌های Bluesky — این‌ها جای توییت را می‌گیرند.
  #
  # چرا توییتر واقعی نیست: X برای خواندن پول می‌گیرد، xcancel مرده، و
  # nitter.net چهل تا هفتاد ساعت عقب است که برای امتیاز ویروسی بی‌فایده است.
  # Bluesky بلادرنگ است و عدد like/repost/reply هم می‌دهد.
  #
  # اکانت‌های خودِ رسانه‌ها (Wired، The Verge، Ars، TechCrunch) عمداً نیستند:
  # فقط تیتر خودشان را بازنشر می‌کنند و با فیدهای RSS پایین تکراری می‌شوند.
  # min_engagement حدود نصف میانه‌ی لایک همان اکانت است.

