    url: https://www.darkreading.com/rss.xml
    label: Dark Reading
    authority: 0.75

  # ────────────────────────────────────────────────────────── هوش مصنوعی

  - type: rss
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    label: TechCrunch AI
    authority: 0.8

  - type: rss
