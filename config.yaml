# منابع و تنظیمات کانال.
#
# چهار نوع منبع:
#   bluesky    — اکانت در Bluesky. عدد like/repost/reply می‌دهد، پس امتیاز ویروسی می‌گیرد.
#   hackernews — داستان‌های تازه‌ی HN بالای min_points. عدد points/comments دارد.
#   lobsters   — صفحه‌ی hottest لابسترز. سیگنالش برای امنیت و سیستم تمیز است.
#   rss        — هر فید RSS. عدد تعاملی ندارد، پس با authority و تازگی رتبه می‌گیرد.
#
# authority بین ۰ و ۱ — فقط برای منابع rss. یعنی «وقتی هیچ سیگنال تعاملی نداریم،
# چقدر به این منبع اعتماد کنیم». عدد بالاتر یعنی شانس بیشتر برای انتخاب شدن.

settings:
  # یک پست در هر اجرا، و cron هر ۱۰ دقیقه (به publish.yml نگاه کنید).
  #
  # عمداً ۱ است تا کانال رگباری نشود. با ۳ پست در هر اجرا، سه پست ظرف ۱۲ ثانیه
  # پشت هم می‌آمدند و بعد نیم‌ساعت سکوت. حالا فاصله‌ها یکنواخت است.
  #
  # بودجه‌ی Gemini هم همان می‌ماند: free tier مدل gemini-2.5-flash حدود ۲۵۰
  # درخواست در روز می‌دهد و هر آیتم یک درخواست است.  1 × 144 اجرا = 144.
  max_posts_per_run: 1

  # نسبت بین دو استخر: نصف پست‌ها اجتماعی (توییت‌ها)، نصف خبری.
  # چون هر اجرا فقط یک پست دارد، این نسبت داخل یک اجرا اعمال نمی‌شود بلکه در
  # طول زمان نگه داشته می‌شود؛ شمارشش در state.json است.
  viral_share: 0.5

  # سقف سن برای منابع دارای عدد تعامل. اینجا تازگی حیاتی است چون کل ایده‌ی
  # امتیاز ویروسی سرعت رشد در ساعات اول است.
  max_age_hours: 12

  # سقف سن برای فیدهای خبری. بازه‌ی بازتری لازم دارند: سایت‌های خبری آخر هفته
  # تقریباً چیزی منتشر نمی‌کنند و با ۱۲ ساعت، شنبه و یکشنبه کانال خالی می‌ماند.
  # تابع زوال زمانی خودش قدیمی‌ترها را ته صف می‌گذارد.
  editorial_max_age_hours: 48

  # فاصله بین ارسال دو پست، برای نخوردن به rate limit تلگرام.
  seconds_between_posts: 4

  # متن کوتاه‌تر از این در فیدهای خبری احتمالاً ریپلای یا تیتر خالی است.
  min_text_length: 80
  # منابع دارای عدد تعامل عنوان کوتاه دارند ولی خودِ عدد کیفیت را ثابت می‌کند.
  min_ranked_text_length: 30

  # اگر آیتم از فید عکس نداشت، صفحه‌ی مقاله را باز کن و از og:image یا از
  # تصاویر داخل خود متن یکی بردار. اگر هیچ‌کدام نبود، assets/fallback.jpg
  # آپلود می‌شود؛ هر پست عکس دارد.
  scrape_images: true

  # کاور شیشه‌ای: عکس مقاله بلور و تیره می‌شود و رویش یک کارت نیمه‌شفاف با
  # تیتر فارسی می‌نشیند. Bot API ظاهر دکمه‌ها را نمی‌دهد ولی تصویر پست دست
  # ماست، پس ظاهر شیشه‌ای همان‌جا ساخته می‌شود.
  glass_cover: true

  # مدل Gemini. free tier.
  gemini_model: gemini-2.5-flash

sources:
  # ─────────────────────────────────────────────── سیگنال ویروسی (عدد تعامل دارند)

  - type: hackernews
    label: Hacker News
    min_points: 50

  - type: lobsters
    label: Lobsters
    # لابسترز جامعه‌ی کوچکی است و امتیازهایش یک رقمی؛ بدون این کف، یک پست
    # ۳ امتیازی از یک بحث ۲۰۰ امتیازی HN جلو می‌زند.
    min_engagement: 25

  - type: bluesky
    handle: simonwillison.net
    label: Simon Willison
    min_engagement: 20

  # ─────────────────────────────────────────────────────────── امنیت و هک

